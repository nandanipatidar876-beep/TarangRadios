# Render Infrastructure as Code (Blueprint)
# Deploy via Render Dashboard -> Blueprints -> Connect Repository

databases:
  - name: tarang-postgres
    plan: free
    databaseName: tarang_db
    user: tarang_user

services:
  - type: web
    name: tarang-radios
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tarang-postgres
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
